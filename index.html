<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9E2022">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Le Banc">
<title>Le Banc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concept : feuille de match. Fond bleu-gris froid, numéros dans des maillots, bleu parquet pour l'action, orange ballon réservé aux convocations. */
:root{
  --bg:#F2F0F0; --surface:#FFFFFF; --surface2:#F8F5F5; --line:#E1D9DA; --ink:#1F1416; --muted:#6A5A5D;
  --accent:#9E2022; --accent-ink:#FFFFFF; --accent-soft:#F7E2E2;
  --ball:#B24509; --ball-soft:#FDE8D8;
  --yes:#17794A; --yes-soft:#DCF0E5; --maybe:#8A5B00; --maybe-soft:#FAEDCB; --no:#47506A; --no-soft:#E4E8F1;
  --danger:#B3261E; --danger-ink:#FFFFFF;
  --t-match:#9E2022; --t-tournoi:#5B3FD1; --t-train:#0F766E; --t-autre:#6A5A5D;
  --scrim:rgba(20,8,10,.55);
  --display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#150D0F; --surface:#211518; --surface2:#2B1C20; --line:#3D2B30; --ink:#F4EAEB; --muted:#B49DA1;
    --accent:#E8575F; --accent-ink:#1A0A0C; --accent-soft:#3C171B;
    --ball:#FF9A5C; --ball-soft:#3D2412;
    --yes:#4FD08E; --yes-soft:#12301F; --maybe:#F0B850; --maybe-soft:#352A10; --no:#AEB9D6; --no-soft:#232B40;
    --danger:#FF8A80; --danger-ink:#2A0A08;
    --t-match:#E8575F; --t-tournoi:#A894FF; --t-train:#4FC7BE; --t-autre:#B49DA1;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#150D0F; --surface:#211518; --surface2:#2B1C20; --line:#3D2B30; --ink:#F4EAEB; --muted:#B49DA1;
  --accent:#E8575F; --accent-ink:#1A0A0C; --accent-soft:#3C171B;
  --ball:#FF9A5C; --ball-soft:#3D2412;
  --yes:#4FD08E; --yes-soft:#12301F; --maybe:#F0B850; --maybe-soft:#352A10; --no:#AEB9D6; --no-soft:#232B40;
  --danger:#FF8A80; --danger-ink:#2A0A08;
  --t-match:#E8575F; --t-tournoi:#A894FF; --t-train:#4FC7BE; --t-autre:#B49DA1;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* En-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-bottom:16px}
.brand{font:600 13px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.id{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:76px;height:76px;flex:none;object-fit:contain}
@media (max-width:520px){.logo{width:60px;height:60px}}
.team{font-size:clamp(24px,5.6vw,40px);line-height:.98;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.season{color:var(--muted);margin-top:6px}
.me{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:44px;max-width:100%}
.chip .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--display);letter-spacing:.04em;flex:none}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip .sw{font-size:13px;color:var(--muted)}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 12px;font:700 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap;min-height:48px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .bd{background:var(--ball);color:#fff;font:700 13px/1 var(--body);min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
:root[data-theme="dark"] .tab .bd{color:#1a0d05}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab .bd{color:#1a0d05}}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.warn[data-armed]{background:var(--danger);color:var(--danger-ink)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* Bandeaux */
.notice{background:var(--maybe-soft);color:var(--maybe);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.todo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.todo button{background:var(--ball-soft);color:var(--ball);border:1px solid transparent;border-radius:99px;padding:8px 14px;font-weight:600;min-height:40px;text-align:left}
.todo button:hover{border-color:var(--ball)}

/* Calendrier */
.grid2{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-h h2{font-size:24px;text-transform:uppercase}
.cal-h .btn{min-width:42px;padding:0 10px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-g .wd{text-align:center;font:600 13px var(--display);letter-spacing:.1em;color:var(--muted);padding:4px 0}
.cell{min-height:50px}
.day{background:var(--surface2);border:1px solid transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 6px;cursor:pointer}
.day:hover{border-color:var(--line)}
.day b{font:700 18px/1 var(--display);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.day.today b{background:var(--accent);color:var(--accent-ink)}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.dots i.off{background:transparent;border:1.5px solid var(--tc)}
.t-match{--tc:var(--t-match)}.t-tournoi{--tc:var(--t-tournoi)}.t-train{--tc:var(--t-train)}.t-autre{--tc:var(--t-autre)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--tc)}

/* Liste d'événements */
.lh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lh h2{font-size:26px;text-transform:uppercase}
.mh{font:700 15px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.list{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.ev:hover{border-color:var(--muted)}
.ev.off .evt{text-decoration:line-through;color:var(--muted)}
.ev>span,.ev>span>span:not(.pills),.dt>span{display:block}
.pc .meta{display:block}
.sheet:focus-visible{outline:none}
.dt{text-align:center;color:var(--tc)}
.dt .w{font:600 13px var(--display);letter-spacing:.14em;text-transform:uppercase}
.dt .d{font:700 38px/1 var(--display)}
.dt .m{font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evt{font:700 22px/1.1 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cnt{text-align:center;min-width:48px}
.cnt b{font:700 28px/1 var(--display);color:var(--ink)}
.cnt small{display:block;font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{font-size:24px;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
.empty .btn{margin-top:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);min-height:36px}
.check input{width:18px;height:18px;margin:0}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted);line-height:1.5}
.pill.yes{background:var(--yes-soft);color:var(--yes)}
.pill.maybe{background:var(--maybe-soft);color:var(--maybe)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill.ball{background:var(--ball-soft);color:var(--ball)}
.pill.type{background:transparent;color:var(--tc);border:1px solid var(--tc)}
.pill.best{background:var(--accent);color:var(--accent-ink)}

/* Feuille modale */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:94vh;max-height:94dvh;overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.ov{align-items:center;padding-block:24px}.sheet{border-radius:16px;box-shadow:var(--shadow)}}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:2}
.eyebrow{font:700 13px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:16px}
.sheet h2{font-size:clamp(28px,6vw,36px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.sheet .when{font:600 20px/1.2 var(--display);letter-spacing:.02em;margin-top:8px}
.sheet .where{margin-top:4px;overflow-wrap:anywhere}
.sheet a{color:var(--accent);font-weight:600}
.notes{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.sec{margin-top:22px}
.sec>h3{font-size:20px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.mine{margin-top:18px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2)}
.mine.conv{border-color:var(--ball)}
.convbanner{color:var(--ball);font-weight:600;margin-bottom:8px}
.lab{font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
.seg button .g{font-weight:700}
.seg button[aria-pressed="true"].yes{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.seg button[aria-pressed="true"].maybe{background:var(--maybe-soft);border-color:var(--maybe);color:var(--maybe)}
.seg button[aria-pressed="true"].no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.seg button[disabled]{opacity:.55;cursor:not-allowed}
.cm{display:block;margin-top:10px}

/* Quorum */
.quorum{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qd{display:flex;gap:5px;flex-wrap:wrap}
.qd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:transparent}
.qd i.f{background:var(--yes);border-color:var(--yes)}
.qd i.x{border-style:dashed}
.qt{font-weight:600}
.qt.ok{color:var(--yes)}
.qt.ko{color:var(--maybe)}

/* Joueurs */
.grp{margin-top:16px}
.grp h4{font-size:18px;text-transform:uppercase;letter-spacing:.1em;display:flex;gap:8px;align-items:center}
.grp h4 .n{background:var(--surface2);border-radius:99px;font:600 13px var(--body);padding:1px 9px;letter-spacing:0;color:var(--muted)}
.people{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.pr{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 10px;background:var(--surface2);border-radius:8px}
.pr .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.pr .nm{font-weight:600;overflow-wrap:anywhere}
.pr .cmt{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.pr .adm{display:flex;gap:6px;align-items:center}
.mini{display:flex;gap:3px}
.mini button{width:34px;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:grid;place-items:center;padding:0}
.mini button[aria-pressed="true"].yes{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.mini button[aria-pressed="true"].maybe{background:var(--maybe-soft);border-color:var(--maybe);color:var(--maybe)}
.mini button[aria-pressed="true"].no{background:var(--no-soft);border-color:var(--no);color:var(--no)}
.cv{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ball);font-weight:600;min-height:34px}
.cv input{width:18px;height:18px;margin:0;accent-color:var(--ball)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.adminbox{margin-top:22px;border:1px dashed var(--line);border-radius:12px;padding:14px}

/* Maillots */
.jersey{width:48px;height:54px;flex:none;background:var(--accent-soft);color:var(--accent);clip-path:polygon(18% 0,36% 0,50% 13%,64% 0,82% 0,100% 20%,86% 36%,86% 100%,14% 100%,14% 36%,0 20%);display:grid;place-items:end center;padding-bottom:7px;font:700 26px/1 var(--display)}
.jersey.pause{background:var(--surface2);color:var(--muted)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mc{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
button.mc:hover{border-color:var(--muted)}
.mc .tx{min-width:0}
.mc .nm{font:700 21px/1.1 var(--display);overflow-wrap:anywhere}
.mc .ps{color:var(--muted);font-size:14px}

/* Sondages */
.pc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.pc:hover{border-color:var(--muted)}
.pc .evt{display:block}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.opt.best{border-color:var(--accent)}
.opt .oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.opt .ol{font:700 21px/1.15 var(--display);overflow-wrap:anywhere}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:8px 0}
.bar i{display:block;height:100%}
.bar .y{background:var(--yes)}.bar .m{background:var(--maybe)}.bar .n{background:var(--no)}
.tl{display:flex;gap:6px;flex-wrap:wrap}
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.mx table{border-collapse:collapse;width:100%;min-width:max-content}
.mx th,.mx td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.mx th{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1}
.mx tr:last-child td{border-bottom:0}
.mx td button,.mx td span.v{width:34px;height:34px;border-radius:6px;display:inline-grid;place-items:center;font-weight:700;border:1.5px solid transparent;background:var(--surface2);color:var(--muted)}
.mx td button{cursor:pointer}
.mx td button:hover{border-color:var(--muted)}
.mx .v.yes,.mx button.yes{background:var(--yes-soft);color:var(--yes)}
.mx .v.maybe,.mx button.maybe{background:var(--maybe-soft);color:var(--maybe)}
.mx .v.no,.mx button.no{background:var(--no-soft);color:var(--no)}

/* Formulaires */
form label{display:block;font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px;margin-top:4px}
textarea{resize:vertical}
input[type=checkbox],input[type=radio]{width:18px;min-height:0;margin:0}
.r3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}
.orow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.4fr) auto;gap:6px;margin-top:6px;align-items:center}
@media (max-width:520px){.orow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.orow input:nth-child(3){grid-column:1 / 3}.orow button{grid-column:1 / 3}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pick{display:grid;gap:8px;margin-top:12px}
.pick button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:52px}
.pick button:hover:not([disabled]){border-color:var(--accent)}
.pick button[disabled]{opacity:.5;cursor:not-allowed}
.pick .jersey{width:36px;height:40px;font-size:19px;padding-bottom:5px}

.ph{border-radius:50%;object-fit:cover;flex:none;display:block}
.ini{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;letter-spacing:.03em}
.phwrap{position:relative;flex:none;width:56px;height:56px}
.nb{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--surface);font:700 14px/20px var(--display);text-align:center}
.prof{display:flex;align-items:center;gap:16px;margin-top:6px}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:16px 0 0;padding:4px 12px 12px;min-width:0}
legend{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 6px}
form label.rad{display:flex;align-items:center;gap:8px;font:500 16px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--ink);margin-top:8px;min-height:36px}
.chat{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.clist{overflow-y:auto;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:6px;height:min(62vh,560px);min-height:220px}
.chat.sm .clist{height:auto;max-height:300px;min-height:120px}
.cdate{align-self:center;font:600 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:90%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface2);border-radius:14px 14px 14px 4px;padding:6px 11px 5px;min-width:0}
.msg.me .bub{background:var(--accent-soft);border-radius:14px 14px 4px 14px}
.bub .by{font:700 15px/1.2 var(--display);letter-spacing:.04em;color:var(--accent)}
.bub .mt{white-space:pre-wrap;overflow-wrap:anywhere}
.bub a{color:var(--accent);font-weight:600}
.bub .mm{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.bub .tm{font-size:12px;color:var(--muted)}
.bub .del{background:none;border:0;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline;min-height:24px}
.bub .del[data-armed]{color:var(--danger);font-weight:600}
.cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.cform textarea{flex:1;min-width:0;min-height:44px;max-height:120px;margin:0;resize:none;line-height:1.35}
@media (max-width:480px){.tab{font-size:18px;padding:10px 9px}}
.bub .you{font:500 13px var(--body);letter-spacing:0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile b{display:block;font:700 42px/1 var(--display);color:var(--ink)}
.tile .tl2{display:block;font:700 15px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tile .sb2{display:block;color:var(--muted);font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.sortb{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sortb[aria-pressed="true"]{color:var(--ink)}
.sub1{display:block;font:400 12px var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.pb{display:block;height:6px;border-radius:3px;background:var(--surface2);margin-top:4px;min-width:84px}
.pb i{display:block;height:100%;border-radius:3px;background:var(--yes)}
.st td{text-align:left}
.st td b{font:700 20px var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:90;max-width:calc(100% - 32px);font-weight:500;box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
.gate{max-width:420px;margin:24px auto;text-align:left}
.gate h2{font-size:26px;text-transform:uppercase;margin-bottom:6px}
.gate input{width:100%;margin:12px 0}
.gate .err{color:var(--danger);font-weight:600;margin:0 0 8px}
.foot{margin-top:28px;text-align:center}
.a2t{display:block;margin:6px auto 10px;max-width:340px;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:8px}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(s,el){return (el||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parse=function(s){var p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
var F={
  long:new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}),

};

var LBL={ev:{yes:'Présent',maybe:'Peut-être',no:'Absent'},po:{yes:'Dispo',maybe:'Peut-être',no:'Pas dispo'}};
var ANSW={yes:'Présent',maybe:'Peut-être',no:'Absent'};

var S={db:null,user:null,dl:null,uid:null,isAdmin:false,canWrite:null,dbOff:false,
  events:[],members:[],polls:[],rsvp:{},proxy:{},team:{},loaded:{},
  tab:'cal',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),selDate:null,showPast:false,limit:12,chat:[],chatLimit:{},statSeason:'',statSort:'train',seen:0,seenInit:false,cc:{},dirtyAll:false,
  modal:null,uidToMember:{},memberToUid:{},guests:[],meId:null,skipId:false,pendingModal:false,lastFocus:null};

/* ---------- Données dérivées ---------- */
function tkey(e){return TYPES[e.type]?e.type:'autre';}
function cmpEv(a,b){return ((a.date||'')+(a.start||'')).localeCompare((b.date||'')+(b.start||''));}
function roster(){return S.members.filter(function(m){return m.status!=='pause';}).sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'fr');});}
function derive(){
  S.uidToMember={};S.memberToUid={};
  S.members.forEach(function(m){if(m.uid&&S.rsvp[m.uid]&&!S.uidToMember[m.uid]){S.memberToUid[m.id]=m.uid;S.uidToMember[m.uid]=m.id;}});
  Object.keys(S.rsvp).forEach(function(uid){
    var r=S.rsvp[uid];
    if(r.memberId&&!S.uidToMember[uid]&&!S.memberToUid[r.memberId]&&S.members.some(function(m){return m.id===r.memberId;})){S.memberToUid[r.memberId]=uid;S.uidToMember[uid]=r.memberId;}
  });
  S.meId=S.uid?(S.uidToMember[S.uid]||null):null;
  S.guests=Object.keys(S.rsvp).filter(function(uid){return !S.uidToMember[uid];}).map(function(uid){return {uid:uid,name:S.rsvp[uid].name||'Invité'};});
}
function pick(list){var best=null;list.forEach(function(a){if(a&&(!best||(a.t||0)>=(best.t||0)))best=a;});return best;}
function dget(d,k,id){return d&&d[k]&&d[k][id]||null;}
function ans(mid,eid){var u=S.memberToUid[mid];return pick([u?dget(S.rsvp[u],'answers',eid):null,dget(S.proxy[mid],'answers',eid)]);}
function gans(uid,eid){return dget(S.rsvp[uid],'answers',eid);}
function vget(d,pid,oid){return d&&d.votes&&d.votes[pid]&&d.votes[pid][oid]||null;}
function vt(mid,pid,oid){var u=S.memberToUid[mid];return pick([u?vget(S.rsvp[u],pid,oid):null,vget(S.proxy[mid],pid,oid)]);}
function gvt(uid,pid,oid){return vget(S.rsvp[uid],pid,oid);}
function myAns(eid){var a=S.meId?ans(S.meId,eid):(S.rsvp[S.uid]?gans(S.uid,eid):null);return a&&a.s?a:null;}
function myVote(pid,oid){var v=S.meId?vt(S.meId,pid,oid):(S.rsvp[S.uid]?gvt(S.uid,pid,oid):null);return v&&v.s?v:null;}
function hasProfile(){return !!(S.uid&&S.rsvp[S.uid]);}
function summary(e){
  var g={yes:[],maybe:[],no:[],none:[]};
  roster().forEach(function(m){var a=ans(m.id,e.id);g[a&&a.s?a.s:'none'].push({m:m,a:a});});
  S.guests.forEach(function(gu){var a=gans(gu.uid,e.id);if(a&&a.s)g[a.s].push({guest:gu,a:a});});
  return g;
}
function isConvoked(e){return !!(S.meId&&(e.convoked||[]).indexOf(S.meId)>-1);}
function pollRows(p){
  var rows=roster().map(function(m){return {name:m.name,mid:m.id,get:function(o){return vt(m.id,p.id,o);}};});
  S.guests.forEach(function(g){
    if((p.options||[]).some(function(o){var v=gvt(g.uid,p.id,o.id);return v&&v.s;}))rows.push({name:g.name,uid:g.uid,guest:true,get:function(o){return gvt(g.uid,p.id,o);}});
  });
  return rows;
}
function tally(p,oid){var t={yes:0,maybe:0,no:0,names:{yes:[],maybe:[],no:[]}};pollRows(p).forEach(function(r){var v=r.get(oid);if(v&&v.s){t[v.s]++;t.names[v.s].push(r.name);}});return t;}
function bestOpt(p){var b=null,bt=null;(p.options||[]).forEach(function(o){var t=tally(p,o.id);if(t.yes>0&&(!bt||t.yes>bt.yes||(t.yes===bt.yes&&t.maybe>bt.maybe))){b=o.id;bt=t;}});return b;}
function optLabel(o){var parts=[];if(o.date)parts.push(fLong(o.date));if(o.time)parts.push(fTime(o.time));var s=parts.join(' · ');if(o.label)s+=(s?' · ':'')+o.label;return s||'Option';}
function pollAnswered(p){return (p.options||[]).some(function(o){return myVote(p.id,o.id);});}

/* ---------- Photos et séries ---------- */
var PHOTO_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
function okPhoto(s){return typeof s==='string'&&s.length>20&&s.length<60000&&PHOTO_RE.test(s)?s:'';}
function photoOfGuest(uid){return S.rsvp[uid]?okPhoto(S.rsvp[uid].photo):'';}
function photoOfMember(mid){
  var u=S.memberToUid[mid],p=u?photoOfGuest(u):'';
  if(p)return p;
  var m=S.members.find(function(x){return x.id===mid;});
  return m?okPhoto(m.photo):'';
}
function myPhoto(){return S.meId?photoOfMember(S.meId):photoOfGuest(S.uid);}
function avatar(src,name,px){
  var st='width:'+px+'px;height:'+px+'px';
  if(src)return '<img class="ph" src="'+src+'" alt="" style="'+st+'">';
  return '<span class="ph ini" aria-hidden="true" style="'+st+';font-size:'+Math.round(px*0.42)+'px">'+esc(initials(name))+'</span>';
}
function loadImg(file){
  return new Promise(function(res,rej){
    var viaReader=function(){
      var fr=new FileReader();
      fr.onload=function(){var i2=new Image();i2.onload=function(){res(i2);};i2.onerror=function(){rej(new Error('load'));};i2.src=fr.result;};
      fr.onerror=function(){rej(new Error('read'));};
      fr.readAsDataURL(file);
    };
    var url=null;
    try{url=URL.createObjectURL(file);}catch(e){viaReader();return;}
    var img=new Image();
    img.onload=function(){res(img);};
    img.onerror=function(){viaReader();};
    img.src=url;
  });
}
function resizePhoto(file){
  return new Promise(function(res,rej){
    if(!file||!/^image\//.test(file.type)){rej(new Error('type'));return;}
    loadImg(file).then(function(img){
      try{
        var s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,N=128;
        var c=document.createElement('canvas');c.width=N;c.height=N;
        var g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,N,N);
        g.drawImage(img,sx,sy,s,s,0,0,N,N);
        res(c.toDataURL('image/jpeg',0.82));
      }catch(e){rej(e);}
    },rej);
  });
}
function seasonEnd(ds){var d=parse(ds||ymd(new Date()));var y=d.getMonth()>=7?d.getFullYear()+1:d.getFullYear();return y+'-06-30';}
function occurrences(start,step,until){
  if(!start||!until)return [];
  var out=[],d=parse(start),end=parse(until);
  for(var i=0;i<80&&d<=end;i++){out.push(ymd(d));d.setDate(d.getDate()+7*step);}
  return out;
}
function seriesFrom(e,incl){return S.events.filter(function(x){return e.seriesId&&x.seriesId===e.seriesId&&(incl?x.date>=e.date:x.date>e.date);});}
function runChunks(jobs,n){
  var chunks=[];for(var i=0;i<jobs.length;i+=n)chunks.push(jobs.slice(i,i+n));
  return chunks.reduce(function(p,c){return p.then(function(){return Promise.all(c.map(function(j){return j();}));});},Promise.resolve());
}
function updateRep(f){
  var sel=f.querySelector('[name=rep]');if(!sel)return;
  var step=parseInt(sel.value,10)||0,box=f.querySelector('#rep-box');box.hidden=!step;
  if(!step)return;
  var d0=f.querySelector('[name=date]').value,occ=occurrences(d0,step,f.querySelector('[name=until]').value),hint=f.querySelector('#rep-hint');
  if(!d0||!occ.length){hint.textContent='Choisis une date de début, puis une date de fin après celle-ci.';return;}
  var wd=F.wdl.format(parse(occ[0]));
  hint.textContent=occ.length+' événement'+(occ.length>1?'s':'')+', '+(step===1?'chaque ':'un ')+wd+(step===2?' sur deux':'')+', du '+fShort(occ[0])+' au '+fShort(occ[occ.length-1])+(occ.length>=80?' (maximum atteint)':'')+'.';
}

/* ---------- Statistiques ---------- */
function seasonOf(ds){var d=parse(ds),y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return y+'-'+(y+1);}
function isPast(e){
  var now=new Date(),today=ymd(now);
  if(e.date<today)return true;
  if(e.date===today&&e.start)return e.start<=pad(now.getHours())+':'+pad(now.getMinutes());
  return false;
}
function statsData(){
  var cur=seasonOf(ymd(new Date())),sel=S.statSeason||cur,seasons={};
  seasons[cur]=1;S.events.forEach(function(e){if(e.date)seasons[seasonOf(e.date)]=1;});
  var past=S.events.filter(function(e){return !e.cancelled&&e.date&&isPast(e)&&(sel==='all'||seasonOf(e.date)===sel);});
  var by={train:[],match:[],tournoi:[],autre:[]};past.forEach(function(e){by[tkey(e)].push(e);});
  var types=['train','match','tournoi','autre'];
  var rows=[];
  function fill(r,get){types.forEach(function(t){var n=0;by[t].forEach(function(e){var a=get(e);if(a&&a.s==='yes')n++;});r[t]=n;});r.total=r.train+r.match+r.tournoi+r.autre;}
  S.members.forEach(function(m){
    var r={name:m.name||'',mid:m.id,paused:m.status==='pause'};
    fill(r,function(e){return ans(m.id,e.id);});
    if(r.paused&&!r.total)return;
    rows.push(r);
  });
  S.guests.forEach(function(g){
    var r={name:g.name,uid:g.uid,guest:true};
    fill(r,function(e){return gans(g.uid,e.id);});
    if(r.total)rows.push(r);
  });
  var avg=by.train.length?by.train.reduce(function(s,e){return s+summary(e).yes.length;},0)/by.train.length:0;
  return {sel:sel,seasons:Object.keys(seasons).sort().reverse(),by:by,rows:rows,pastCount:past.length,avg:avg};
}
function viewStats(){
  var D=statsData(),by=D.by;
  var opts='<option value="all"'+(D.sel==='all'?' selected':'')+'>Toutes les saisons</option>'+D.seasons.map(function(s){return '<option value="'+esc(s)+'"'+(D.sel===s?' selected':'')+'>Saison '+esc(s)+'</option>';}).join('');
  var h='<div class="lh"><h2>Statistiques</h2><div><label class="sr" for="st-season">Saison</label><select id="st-season" data-chg="season" style="width:auto;margin:0">'+opts+'</select></div></div>';
  if(!D.pastCount)return h+'<div class="empty"><h3>Pas encore de chiffres</h3><p>Les statistiques se remplissent avec les événements passés. Ils comptent dès que leur date est dépassée, sauf s\'ils sont annulés.</p></div>';
  var cols=[['train','Entraînements','séance'],['match','Matchs','match'],['tournoi','Tournois','tournoi'],['autre','Autres','événement']].filter(function(c){return by[c[0]].length>0;});
  var sk=(D.rows.length&&(S.statSort==='name'||S.statSort==='total'||cols.some(function(c){return c[0]===S.statSort;})))?S.statSort:cols[0][0];
  var rows=D.rows.slice().sort(function(a,b){
    if(sk==='name')return a.name.localeCompare(b.name,'fr');
    return (b[sk]-a[sk])||(b.train-a.train)||a.name.localeCompare(b.name,'fr');
  });
  // chiffres de l'équipe
  var lead=null;
  if(by.train.length){var mx=0;D.rows.forEach(function(r){if(r.train>mx)mx=r.train;});if(mx>0)lead={n:mx,names:D.rows.filter(function(r){return r.train===mx;}).map(function(r){return r.name;})};}
  h+='<div class="tiles">';
  if(by.train.length)h+='<div class="tile"><span class="tl2">Entraînements</span><b>'+by.train.length+'</b><span class="sb2">'+(Math.round(D.avg*10)/10).toString().replace('.',',')+' présents en moyenne</span></div>';
  if(by.match.length)h+='<div class="tile"><span class="tl2">Matchs joués</span><b>'+by.match.length+'</b><span class="sb2">sur la période</span></div>';
  if(by.tournoi.length)h+='<div class="tile"><span class="tl2">Tournois</span><b>'+by.tournoi.length+'</b><span class="sb2">sur la période</span></div>';
  if(lead)h+='<div class="tile"><span class="tl2">Le plus assidu</span><b>'+lead.n+'<small style="font-size:22px"> / '+by.train.length+'</small></b><span class="sb2">'+esc(lead.names.slice(0,2).join(', ')+(lead.names.length>2?' +'+(lead.names.length-2):''))+'</span></div>';
  h+='</div>';
  if(!rows.length)return h+'<div class="empty"><p>Personne n\'a encore répondu « Présent » sur cette période.</p></div>';
  // tableau par joueur
  var th=function(k,label,sub,total){return '<th scope="col" aria-sort="'+(sk===k?'descending':'none')+'"><button type="button" class="sortb" data-act="stat-sort" data-k="'+k+'" aria-pressed="'+(sk===k)+'">'+label+(sk===k&&k!=='name'?' ↓':'')+'</button>'+(sub?'<span class="sub1">'+sub+'</span>':'')+'</th>';};
  h+='<div class="mx st"><table><thead><tr>'+th('name','Joueur','')+cols.map(function(c){var n=by[c[0]].length;return th(c[0],c[1],n+' '+c[2]+(n>1?'s':''));}).join('')+(cols.length>1?th('total','Total',''):'')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td><span style="display:inline-flex;align-items:center;gap:8px">'+avatar(r.mid?photoOfMember(r.mid):photoOfGuest(r.uid),r.name,28)+esc(r.name)+(r.guest?' <span class="pill">Invité</span>':'')+(r.paused?' <span class="pill">En pause</span>':'')+'</span></td>';
    cols.forEach(function(c){var n=by[c[0]].length,v=r[c[0]],pc=n?Math.round(v/n*100):0;h+='<td><b>'+v+'</b> / '+n+' <span class="muted">· '+pc+' %</span><span class="pb" aria-hidden="true"><i style="width:'+pc+'%"></i></span></td>';});
    if(cols.length>1)h+='<td><b>'+r.total+'</b></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div><p class="muted" style="margin-top:10px;font-size:14px">Une présence compte quand la réponse est « Présent » sur un événement passé et non annulé. L\'admin peut corriger une réponse depuis la fiche de l\'événement.</p>';
  return h;
}

/* ---------- Discussions ---------- */
function loadSeen(){try{var v=localStorage.getItem('banc.seen');if(v!==null&&v!=='')return Number(v);}catch(e){}return null;}
function saveSeen(t){try{localStorage.setItem('banc.seen',String(t));}catch(e){}}
function latestGeneral(){var t=0;S.chat.forEach(function(m){if(m.room==='general'&&(m.t||0)>t)t=m.t;});return t;}
function unread(){return S.chat.filter(function(m){return m.room==='general'&&(m.t||0)>S.seen&&m.uid!==S.uid;}).length;}
function markSeen(){var l=latestGeneral();if(l>S.seen){S.seen=l;saveSeen(l);}}
function authorName(uid){
  var mid=S.uidToMember[uid];
  if(mid){var m=S.members.find(function(x){return x.id===mid;});if(m&&m.name)return m.name;}
  var r=S.rsvp[uid];return r&&r.name?r.name:'Quelqu\'un';
}
function authorPhoto(uid){var mid=S.uidToMember[uid];return mid?photoOfMember(mid):photoOfGuest(uid);}
function roomMsgs(room){return S.chat.filter(function(m){return m.room===room;}).sort(function(a,b){return (a.t||0)-(b.t||0);});}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';});}
function dayLabel(dk){var y=new Date();y.setDate(y.getDate()-1);if(dk===ymd(new Date()))return 'Aujourd\'hui';if(dk===ymd(y))return 'Hier';return fLong(dk);}
function autoGrow(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';}
function chatListHtml(room){
  var all=roomMsgs(room),lim=S.chatLimit[room]||80,shown=all.slice(-lim),h='';
  if(all.length>shown.length)h+='<button class="btn sm" data-act="chat-more" data-room="'+esc(room)+'" style="align-self:center">Messages précédents ('+(all.length-shown.length)+')</button>';
  if(!shown.length)return h+'<p class="muted" style="margin:auto;text-align:center">Aucun message pour l\'instant. Écris le premier.</p>';
  var prev=null,prevDay='';
  shown.forEach(function(m){
    var d=new Date(m.t||0),dk=ymd(d),mine=m.uid===S.uid;
    if(dk!==prevDay){h+='<div class="cdate">'+esc(dayLabel(dk))+'</div>';prevDay=dk;prev=null;}
    var grouped=prev&&prev.uid===m.uid&&((m.t||0)-(prev.t||0))<300000;
    h+='<div class="msg'+(mine?' me':'')+'">'+avatar(authorPhoto(m.uid),authorName(m.uid),28)+'<div class="bub"><div class="by">'+esc(authorName(m.uid))+(mine?' <span class="you">· toi</span>':'')+'</div>'+'<div class="mt">'+linkify(String(m.text==null?'':m.text))+'</div><div class="mm"><span class="tm">'+pad(d.getHours())+'h'+pad(d.getMinutes())+'</span>'+((mine||S.isAdmin)&&!S.dbOff?'<button class="del" type="button" data-act="chat-del" data-id="'+esc(m.id)+'">Supprimer</button>':'')+'</div></div></div>';
    prev=m;
  });
  return h;
}
function chatBox(room,small){
  var can=hasProfile()&&S.canWrite!==false&&!S.dbOff;
  var h='<div class="chat'+(small?' sm':'')+'" data-k="'+(can?1:0)+'"><div class="clist" data-room="'+esc(room)+'" role="log" aria-label="Messages">'+chatListHtml(room)+'</div>';
  if(can)h+='<form class="cform" data-form="chat" data-room="'+esc(room)+'"><textarea class="cin" rows="1" maxlength="500" placeholder="Écrire un message…" aria-label="Ton message"></textarea><button class="btn primary" type="submit">Envoyer</button></form>';
  else if(S.uid&&S.canWrite!==false&&!S.dbOff)h+='<div class="cform"><button class="btn primary" type="button" data-act="identity">Choisis ton nom pour écrire</button></div>';
  else h+='<div class="cform"><p class="muted">Lecture seule : tu ne peux pas écrire ici.</p></div>';
  return h+'</div>';
}
function viewChat(){return '<div class="lh"><h2>Discussion de l\'équipe</h2></div>'+chatBox('general',false);}

    var near=el.scrollTop+el.clientHeight>=el.scrollHeight-80;

/* ---------- Écritures ---------- */
var chain=Promise.resolve();
function write(fn){var p=chain.then(fn).then(function(){return true;},function(e){toast(errMsg(e));return false;});chain=p;return p;}
function errMsg(e){var c=e&&e.code;
  if(c==='permission-denied')return "Action refusée : ton accès ne permet pas de modifier ces données.";
  if(c==='unavailable')return "Pas de connexion, réessaie dans un instant.";
  if(c==='invalid_argument')return "Action refusée : ton accès ne permet pas de modifier ces données.";
  if(c==='quota_exceeded')return "L'espace de stockage de l'appli est plein.";
  if(c==='resource_exhausted')return "Trop d'actions d'un coup, réessaie dans un instant.";
  return "Enregistrement impossible, réessaie dans un instant.";}
function mergeDoc(ref,data){return ref.get().then(function(s){return s.exists?ref.update(data):ref.set(data);});}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true;},3800);}

function routeFor(target){

}
function setAnswer(eid,s,c,target){

}
function setVote(pid,oid,s,target){

}
function saveIdentity(memberId,name){

    return s.exists?ref.update({name:name,memberId:memberId||null}):ref.set({name:name,memberId:memberId||null,answers:{},votes:{}});
  });});
}

function myName(){if(S.meId){var m=S.members.find(function(x){return x.id===S.meId;});return m?m.name:'';}var r=S.rsvp[S.uid];return r?r.name:'';}

function render(chatOnly){

  // vue
  var ready=S.dbOff||(S.loaded.events&&S.loaded.members&&S.loaded.polls&&S.loaded.rsvp&&S.loaded.proxy&&S.loaded.team&&S.loaded.chat);
  var v=$('#view');

function maybeIdentity(){

/* ---------- À faire ---------- */
function todos(){
  if(!hasProfile())return null;
  var today=ymd(new Date());
  var up=S.events.filter(function(e){return e.date>=today&&!e.cancelled;}).sort(cmpEv);
  var conv=up.filter(function(e){return isConvoked(e)&&!myAns(e.id);});
  var un=up.filter(function(e){return !myAns(e.id)&&conv.indexOf(e)<0;});
  var pl=S.polls.filter(function(p){return !p.closed&&!pollAnswered(p);});
  return {conv:conv,un:un,pl:pl};
}
function todoStrip(td){
  if(!td||(!td.conv.length&&!td.un.length&&!td.pl.length))return '';
  var h='<div class="todo">';
  if(td.conv.length)h+='<button data-act="open-event" data-id="'+esc(td.conv[0].id)+'">'+td.conv.length+(td.conv.length>1?' convocations à confirmer':' convocation à confirmer')+'</button>';
  if(td.un.length)h+='<button data-act="open-event" data-id="'+esc(td.un[0].id)+'">'+td.un.length+(td.un.length>1?' événements sans réponse':' événement sans réponse')+'</button>';
  if(td.pl.length)h+='<button data-act="tab" data-t="polls">'+td.pl.length+(td.pl.length>1?' sondages en attente':' sondage en attente')+'</button>';
  return h+'</div>';
}

/* ---------- Calendrier ---------- */
function viewCal(td){S.cc={};S.chat.forEach(function(m){S.cc[m.room]=(S.cc[m.room]||0)+1;});return todoStrip(td)+'<div class="grid2"><section aria-label="Calendrier">'+calGrid()+'</section><section aria-label="Événements">'+evList()+'</section></div>';}
function calGrid(){
  var y=S.month.getFullYear(),mo=S.month.getMonth();
  var off=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),today=ymd(new Date());
  var by={};S.events.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e);});
  var h='<div class="cal"><div class="cal-h"><button class="btn" data-act="month" data-d="-1" aria-label="Mois précédent">‹</button><h2>'+esc(cap(F.month.format(S.month)))+'</h2><button class="btn" data-act="month" data-d="1" aria-label="Mois suivant">›</button></div><div class="cal-g">';
  ['L','M','M','J','V','S','D'].forEach(function(d){h+='<span class="wd" aria-hidden="true">'+d+'</span>';});
  for(var i=0;i<off;i++)h+='<span class="cell"></span>';
  for(var d=1;d<=n;d++){
    var ds=y+'-'+pad(mo+1)+'-'+pad(d),evs=by[ds]||[];
    var dots=evs.slice(0,4).map(function(e){return '<i class="t-'+tkey(e)+(e.cancelled?' off':'')+'"></i>';}).join('');
    var lab=fLong(ds)+(evs.length?', '+evs.length+(evs.length>1?' événements':' événement'):'');
    h+='<button class="cell day'+(ds===today?' today':'')+(ds===S.selDate?' sel':'')+'" data-act="pick-day" data-d="'+ds+'" aria-label="'+esc(lab)+'" aria-pressed="'+(ds===S.selDate)+'"><b>'+d+'</b><span class="dots">'+dots+'</span></button>';
  }
  h+='</div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="today">Aujourd\'hui</button></div>';
  h+='<div class="legend">'+Object.keys(TYPES).map(function(k){return '<span class="t-'+k+'"><i></i>'+TYPES[k]+'</span>';}).join('')+'</div></div>';
  return h;
}
function evList(){
  var today=ymd(new Date()),list=S.events.slice().sort(cmpEv),title;
  if(S.selDate){list=list.filter(function(e){return e.date===S.selDate;});title=fLong(S.selDate);}
  else{title='À venir';if(!S.showPast)list=list.filter(function(e){return e.date>=today;});}
  var total=list.length;if(!S.selDate&&!S.showPast)list=list.slice(0,S.limit);
  var h='<div class="lh"><h2>'+esc(title)+'</h2><div class="row">';
  if(S.selDate)h+='<button class="btn sm" data-act="clear-day">Tout afficher</button>';
  if(S.isAdmin)h+='<button class="btn primary sm" data-act="new-event">+ Événement</button>';
  h+='</div></div>';
  if(!S.selDate)h+='<label class="check"><input type="checkbox" data-chg="past"'+(S.showPast?' checked':'')+'> Afficher aussi les événements passés</label>';
  if(!list.length){
    h+='<div class="empty"><h3>'+(S.selDate?'Rien ce jour-là':'Rien au programme')+'</h3><p>'+(S.isAdmin?(S.events.length?'Ajoute un match, un entraînement ou un tournoi.':'Crée le premier événement pour que chacun puisse répondre.'):"L'admin n'a encore rien programmé.")+'</p>'+(S.isAdmin?'<button class="btn primary" data-act="new-event">+ Ajouter un événement</button>':'')+'</div>';
    return h;
  }
  var cur='';h+='<div class="list">';
  list.forEach(function(e){
    var mk=e.date.slice(0,7);
    if(!S.selDate&&mk!==cur){cur=mk;h+='</div><h3 class="mh">'+esc(cap(F.month.format(parse(e.date))))+'</h3><div class="list">';}
    h+=evCard(e);
  });
  h+='</div>';
  if(total>list.length)h+='<div class="row" style="margin-top:12px"><button class="btn" data-act="more">Afficher la suite ('+(total-list.length)+')</button></div>';
  return h;
}
function evCard(e){
  var tk=tkey(e),sm=summary(e),my=myAns(e.id),conv=isConvoked(e),d=parse(e.date);
  var pills='<span class="pill type">'+TYPES[tk]+'</span>';

/* ---------- Détail d'un événement ---------- */
function seg(kind,act,ids,cur,dis){
  return '<div class="seg" role="group">'+['yes','maybe','no'].map(function(s){return '<button type="button" class="'+s+'" data-act="'+act+'" data-s="'+s+'" '+ids+' aria-pressed="'+(cur===s)+'"'+(dis?' disabled':'')+'><span class="g" aria-hidden="true">'+G[s]+'</span>'+LBL[kind][s]+'</button>';}).join('')+'</div>';
}
function gcal(e){
  var d=e.date.replace(/-/g,''),dates;
  if(e.start){
    var st=e.start.replace(':','')+'00',en;
    if(e.end)en=e.end.replace(':','')+'00';else{var p=e.start.split(':').map(Number);en=pad((p[0]+2)%24)+pad(p[1])+'00';}
    dates=d+'T'+st+'/'+d+'T'+en;
  }else{var nx=parse(e.date);nx.setDate(nx.getDate()+1);dates=d+'/'+ymd(nx).replace(/-/g,'');}
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dates+'&location='+encodeURIComponent(e.place||'')+'&details='+encodeURIComponent(e.notes||'')+'&ctz=Europe%2FParis';
}
function convocMsg(e){
  var names=(e.convoked||[]).map(function(id){return S.members.find(function(m){return m.id===id;});}).filter(Boolean).map(function(m){return m.name;});
  var l=['🏀 Convocation · '+e.title,'📅 '+fLong(e.date)+(e.start?' à '+fTime(e.start):'')];
  if(e.place)l.push('📍 '+e.place);

  l.push('Convoqués ('+names.length+') : '+(names.join(', ')||'à définir'));

  return l.join('\n');

/* ---------- Fenêtre modale ---------- */
function openModal(m){
  if(!S.modal)S.lastFocus=document.activeElement;
  S.modal=m;drawModal(true);
}
function closeModal(){
  S.modal=null;S.pendingModal=false;$('#ov').hidden=true;
  if(S.lastFocus&&document.body.contains(S.lastFocus))try{S.lastFocus.focus();}catch(e){}
}
function modalContent(){
  var m=S.modal;
  switch(m.kind){
    case 'event':{var e=S.events.find(function(x){return x.id===m.id;});if(!e)return m.pending?{eyebrow:'Événement',body:'<p class="muted">Chargement…</p>'}:null;return evView(e);}
    case 'event-edit':{var e2=m.id?S.events.find(function(x){return x.id===m.id;}):null;if(m.id&&!e2)return null;return evForm(e2,m.pre);}
    case 'poll':{var p=S.polls.find(function(x){return x.id===m.id;});if(!p)return m.pending?{eyebrow:'Sondage',body:'<p class="muted">Chargement…</p>'}:null;return pollView(p);}
    case 'poll-edit':{var p2=m.id?S.polls.find(function(x){return x.id===m.id;}):null;if(m.id&&!p2)return null;return pollForm(p2);}
    case 'member':{var mm=m.id?S.members.find(function(x){return x.id===m.id;}):null;if(m.id&&!mm)return null;return memberForm(mm);}
    case 'bulk':return bulkForm();
    case 'team':return settingsForm();
    case 'identity':return identityView();
    case 'profile':return profileView();
    case 'copy':return {eyebrow:'Copier',form:true,body:'<h2>Copier le message</h2><p class="muted" style="margin:6px 0 10px">Ton navigateur bloque la copie automatique. Sélectionne le texte et copie-le.</p><textarea id="copybox" rows="9" readonly>'+esc(m.text)+'</textarea><div class="actions"><button class="btn" type="button" data-act="close">Fermer</button></div>'};
  }
  return null;
}
function drawModal(first){
  var ov=$('#ov'),sh=$('#sheet'),c=modalContent();
  if(!c){closeModal();return;}
  var st=sh.scrollTop;
  var cin0=sh.querySelector('.cin'),draft=(cin0&&!first)?cin0.value:null,hadFocus=!!cin0&&document.activeElement===cin0;
  var cl0=sh.querySelector('.clist'),cst=(cl0&&!first)?{t:cl0.scrollTop,n:cl0.scrollTop+cl0.clientHeight>=cl0.scrollHeight-80}:null;
  sh.innerHTML='<div class="sh-head"><span class="eyebrow">'+esc(c.eyebrow)+'</span><button class="x" data-act="close" aria-label="Fermer">✕</button></div>'+c.body;
  ov.hidden=false;
  var ef=sh.querySelector('form[data-form=event]');if(ef)updateRep(ef);
  var cin1=sh.querySelector('.cin');
  if(cin1&&draft!=null){cin1.value=draft;autoGrow(cin1);if(hadFocus){cin1.focus();try{cin1.setSelectionRange(draft.length,draft.length);}catch(e){}}}
  var cl1=sh.querySelector('.clist');
  if(cl1)cl1.scrollTop=(!cst||cst.n)?cl1.scrollHeight:cst.t;
  if(first){sh.scrollTop=0;var f=sh.querySelector('form input:not([type=hidden]),form textarea');if(c.form&&f)f.focus();else sh.focus();if(S.modal.kind==='copy'){var cb=$('#copybox');cb.focus();cb.select();}}
  else sh.scrollTop=st;
}
function refreshModal(){
  if(!S.modal)return;
  var k=S.modal.kind;
  if(k==='event'||k==='poll'){
    var a=document.activeElement;
    if(a&&((a.tagName==='INPUT'&&a.type==='text')||a.tagName==='TEXTAREA')&&$('#sheet').contains(a)){S.pendingModal=true;updateChatLists();return;}
    drawModal(false);
  }else if(k==='event-edit'||k==='poll-edit'||k==='member'){
    if(!modalContent())closeModal();
  }else if(k==='profile'){
    return;
  }else if(k==='identity'){
    var ai=document.activeElement;
    if(ai&&ai.tagName==='INPUT'&&$('#sheet').contains(ai))return;
    drawModal(false);
  }
}

    case 'today':var n=new Date();S.month=new Date(n.getFullYear(),n.getMonth(),1);S.selDate=null;render();break;
    case 'pick-day':S.selDate=S.selDate===d.d?null:d.d;render();break;
    case 'clear-day':S.selDate=null;render();break;
    case 'close':closeModal();break;
    case 'identity':openModal({kind:'identity'});break;
    case 'open-event':openModal({kind:'event',id:d.id});break;
    case 'open-poll':openModal({kind:'poll',id:d.id});break;
    case 'new-event':openModal({kind:'event-edit'});break;
    case 'edit-event':openModal({kind:'event-edit',id:d.id});break;
    case 'new-poll':openModal({kind:'poll-edit'});break;
    case 'edit-poll':openModal({kind:'poll-edit',id:d.id});break;
    case 'new-member':openModal({kind:'member'});break;
    case 'edit-member':openModal({kind:'member',id:d.id});break;
    case 'bulk':openModal({kind:'bulk'});break;
    case 'team-settings':openModal({kind:'team'});break;
    case 'export':exportCsv();break;
    case 'ans':{
      var e=findEv(d.id);if(!e)break;var cur=myAns(e.id),same=cur&&cur.s===d.s;
      setAnswer(e.id,same?'':d.s,same?'':(cur&&cur.c),{mid:S.meId,uid:S.uid});break;
    }
    case 'proxy':{
      var e1=findEv(d.id);if(!e1)break;var c1=ans(d.mid,e1.id),sm=c1&&c1.s===d.s;
      setAnswer(e1.id,sm?'':d.s,sm?'':(c1&&c1.c),{mid:d.mid});break;
    }
    case 'vote':{
      var cv=myVote(d.pid,d.oid),sv=cv&&cv.s===d.s;
      setVote(d.pid,d.oid,sv?'':d.s,{mid:S.meId,uid:S.uid});break;
    }
    case 'cell':{
      var cur2=(d.mid?vt(d.mid,d.pid,d.oid):gvt(d.uid,d.pid,d.oid)),s0=cur2&&cur2.s||'';
      var nx={'':'yes',yes:'maybe',maybe:'no',no:''}[s0];
      setVote(d.pid,d.oid,nx,d.mid?{mid:d.mid}:{uid:d.uid});break;
    }
    case 'pick-me':{
      var m=S.members.find(function(x){return x.id===d.id;});if(!m)break;
      saveIdentity(m.id,m.name).then(function(ok){if(ok){closeModal();toast('Salut '+m.name+' !');}});break;
    }
    case 'convoke-set':{
      var e2=findEv(d.id);if(!e2)break;var ids=[];
      if(d.w==='all')ids=S.members.filter(function(x){return x.status==='actif';}).map(function(x){return x.id;});
      else if(d.w==='yes'){var sm2=summary(e2);ids=sm2.yes.concat(sm2.maybe).filter(function(x){return x.m;}).map(function(x){return x.m.id;});}
      write(function(){return S.db.doc('events/'+e2.id).update({convoked:ids});});break;
    }
    case 'copy-convoc':{var e3=findEv(d.id);if(e3)copyText(convocMsg(e3));break;}
    case 'cancel-event':{var e4=findEv(d.id);if(e4)write(function(){return S.db.doc('events/'+e4.id).update({cancelled:!e4.cancelled});});break;}
    case 'del-event':arm(el,function(){
      write(function(){
        var ms=S.chat.filter(function(m){return m.room===d.id;});
        return S.db.doc('events/'+d.id).delete().then(function(){return runChunks(ms.map(function(m){return function(){return S.db.doc('chat/'+m.id).delete();};}),5);});
      }).then(function(ok){if(ok){closeModal();toast('Événement supprimé');}});
    });break;
    case 'toggle-poll':{var p=findPoll(d.id);if(p)write(function(){return S.db.doc('polls/'+p.id).update({closed:!p.closed});});break;}
    case 'del-poll':arm(el,function(){write(function(){return S.db.doc('polls/'+d.id).delete();}).then(function(ok){if(ok){closeModal();toast('Sondage supprimé');}});});break;
    case 'poll-event':{
      var p3=findPoll(d.pid);if(!p3)break;var o=(p3.options||[]).find(function(x){return x.id===d.oid;});if(!o)break;
      openModal({kind:'event-edit',pre:{title:p3.title,date:o.date||ymd(new Date()),start:o.time||'',fromPoll:p3.id,fromOpt:o.id}});break;
    }
    case 'del-member':arm(el,function(){
      write(function(){return S.db.doc('members/'+d.id).delete().then(function(){return S.db.doc('proxy/'+d.id).delete();});}).then(function(ok){if(ok){closeModal();toast('Joueur supprimé');}});
    });break;
    case 'adopt':{
      var g=S.guests.find(function(x){return x.uid===d.uid;});if(!g)break;
      var ref=S.db.collection('members').doc();
      write(function(){return ref.set({name:g.name,number:'',pos:'',status:'actif',uid:g.uid});}).then(function(ok){if(ok)toast(g.name+' rejoint l\'effectif');});break;
    }
    case 'add-opt':{
      var box=$('#opts'),rows=box.querySelectorAll('.orow'),last=rows[rows.length-1],nd='';
      if(last){var dv=last.querySelector('[name=od]').value;if(dv){var dd=parse(dv);dd.setDate(dd.getDate()+7);nd=ymd(dd);}}
      box.insertAdjacentHTML('beforeend',optRow({date:nd,time:last?last.querySelector('[name=ot]').value:''}));break;
    }
    case 'stat-sort':S.statSort=d.k;render();break;
    case 'chat-more':S.chatLimit[d.room]=(S.chatLimit[d.room]||80)+80;updateChatLists();break;
    case 'relog':showGate('');break;
    case 'a2hs':{
      if(S.installEv){var ie=S.installEv;S.installEv=null;ie.prompt();break;}
      var ua=navigator.userAgent||'',ios=/iphone|ipad|ipod/i.test(ua),tx=$('#a2hst');
      tx.textContent=ios?"Sur iPhone : touche le bouton Partager (carré avec une flèche) dans Safari, puis « Sur l'écran d'accueil ».":"Sur Android : ouvre le menu ⋮ du navigateur, puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».";
      tx.hidden=!tx.hidden;break;}
    case 'chat-del':arm(el,function(){write(function(){return S.db.doc('chat/'+d.id).delete();});});break;
    case 'profile':openModal({kind:'profile'});break;
    case 'more':S.limit+=12;render();break;
    case 'pick-photo':{var inp=document.getElementById(d.target);if(inp)inp.click();break;}
    case 'photo-del':
      write(function(){return S.db.doc('rsvp/'+S.uid).update({photo:''});}).then(function(ok){if(ok){toast('Photo retirée');setTimeout(function(){if(S.modal&&S.modal.kind==='profile')drawModal(false);},150);}});break;
    case 'photo-clear-member':{
      var mf=$('form[data-form=member]');if(mf){mf.querySelector('[name=photo]').value='';$('#mph').innerHTML=avatar('',mf.querySelector('[name=name]').value,64);}break;
    }
    case 'del-series':arm(el,function(){
      var e5=findEv(d.id);if(!e5)return;var gone=seriesFrom(e5,true);
      write(function(){
        var ids=gone.map(function(x){return x.id;}),ms=S.chat.filter(function(m){return ids.indexOf(m.room)>-1;});
        var jobs=gone.map(function(x){return function(){return S.db.doc('events/'+x.id).delete();};}).concat(ms.map(function(m){return function(){return S.db.doc('chat/'+m.id).delete();};}));
        return runChunks(jobs,5);
      }).then(function(ok){if(ok){closeModal();toast(gone.length+' événements supprimés');}});
    });break;
    case 'rm-opt':{var rr=el.closest('.orow');if($('#opts').querySelectorAll('.orow').length>1)rr.remove();break;}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target.closest('[data-chg]');if(!el)return;
  var k=el.dataset.chg;
  if(k==='past'){S.showPast=el.checked;render();}
  else if(k==='season'){S.statSeason=el.value;render();}
  else if(k==='photo-me'){
    var f1=el.files&&el.files[0];el.value='';if(!f1||!S.uid||!S.rsvp[S.uid])return;
    resizePhoto(f1).then(function(url){return write(function(){return S.db.doc('rsvp/'+S.uid).update({photo:url});});}).then(function(ok){
      if(ok){toast('Photo enregistrée');setTimeout(function(){if(S.modal&&S.modal.kind==='profile')drawModal(false);},150);}
    },function(){toast("Cette image n'a pas pu être lue.");});
  }
  else if(k==='photo-member'){
    var f2=el.files&&el.files[0];el.value='';if(!f2)return;
    resizePhoto(f2).then(function(url){
      var mf=$('form[data-form=member]');if(!mf)return;
      mf.querySelector('[name=photo]').value=url;$('#mph').innerHTML=avatar(url,mf.querySelector('[name=name]').value,64);
    },function(){toast("Cette image n'a pas pu être lue.");});
  }
  else if(k==='convoke'){
    var e=findEv(el.dataset.id);if(!e)return;var set=new Set(e.convoked||[]);
    if(el.checked)set.add(el.dataset.mid);else set.delete(el.dataset.mid);
    write(function(){return S.db.doc('events/'+e.id).update({convoked:Array.from(set)});});
  }else if(k==='comment'){
    var e2=findEv(el.dataset.id),cur=e2&&myAns(e2.id);if(!e2||!cur)return;
    setAnswer(e2.id,cur.s,el.value.trim(),{mid:S.meId,uid:S.uid});
  }
});
document.addEventListener('focusout',function(){if(S.pendingModal){S.pendingModal=false;setTimeout(refreshModal,60);}});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&S.modal){closeModal();return;}
  var t=ev.target;
  if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing&&t.classList&&t.classList.contains('cin')&&!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)){
    ev.preventDefault();var cf=t.closest('form');if(cf)cf.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains('cin'))autoGrow(t);
  var f=t.closest&&t.closest('form[data-form=event]');if(f)updateRep(f);
});

document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  var fd=new FormData(f),kind=f.dataset.form,id=f.dataset.id;
  var val=function(n){return String(fd.get(n)||'').trim();};
  if(kind==='gate'){submitGate(val('code'));return;}
  if(kind==='event'){
    var data={title:val('title'),type:val('type'),date:val('date'),start:val('start'),end:val('end'),place:val('place'),notes:val('notes'),min:Math.max(1,Math.min(15,parseInt(val('min'),10)||5))};
    if(!data.title||!data.date){toast('Le titre et la date sont obligatoires.');return;}
    if(id){
      var cur0=findEv(id),later=(val('scope')==='next'&&cur0)?seriesFrom(cur0,false):[];
      var shared={title:data.title,type:data.type,start:data.start,end:data.end,place:data.place,notes:data.notes,min:data.min};
      var jobs0=[function(){return S.db.doc('events/'+id).update(data);}].concat(later.map(function(x){return function(){return S.db.doc('events/'+x.id).update(shared);};}));
      write(function(){return runChunks(jobs0,5);}).then(function(ok){if(ok){toast(later.length?'Série mise à jour ('+(later.length+1)+' événements)':'Événement mis à jour');openModal({kind:'event',id:id});}});
    }
    else if(parseInt(val('rep'),10)){
      var step=parseInt(val('rep'),10),occ=occurrences(data.date,step,val('until'));
      if(!occ.length){toast('La date de fin doit être après la date de début.');return;}
      var sid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      write(function(){
        return runChunks(occ.map(function(dd){var rf=S.db.collection('events').doc();var o=Object.assign({},data,{date:dd,convoked:[],cancelled:false,createdAt:Date.now(),seriesId:sid});return function(){return rf.set(o);};}),5);
      }).then(function(ok){if(ok){closeModal();S.tab='cal';S.selDate=null;toast(occ.length+' événement'+(occ.length>1?'s':'')+' créé'+(occ.length>1?'s':''));render();}});
    }
    else{
      var ref=S.db.collection('events').doc(),pid=f.dataset.poll,oid=f.dataset.opt;
      write(function(){
        data.convoked=[];data.cancelled=false;data.createdAt=Date.now();
        return ref.set(data).then(function(){return pid?S.db.doc('polls/'+pid).update({closed:true,decided:oid,eventId:ref.id}):null;});
      }).then(function(ok){if(ok){toast('Événement créé');openModal({kind:'event',id:ref.id,pending:true});}});
    }
  }else if(kind==='poll'){
    var title=val('title'),opts=[];
    var old=id?findPoll(id):null;
    f.querySelectorAll('.orow').forEach(function(r,i){
      var od=r.querySelector('[name=od]').value,ot=r.querySelector('[name=ot]').value,ol=r.querySelector('[name=ol]').value.trim();
      if(!od&&!ol)return;
      opts.push({id:r.dataset.oid||('o'+Date.now().toString(36)+i),date:od,time:ot,label:ol});
    });
    if(!title){toast('Écris la question du sondage.');return;}
    if(!opts.length){toast('Ajoute au moins une option avec une date ou une précision.');return;}
    var pd={title:title,desc:val('desc'),options:opts};
    if(id){write(function(){return S.db.doc('polls/'+id).update(pd);}).then(function(ok){if(ok){toast('Sondage mis à jour');openModal({kind:'poll',id:id});}});}
    else{
      var pr=S.db.collection('polls').doc();pd.closed=false;pd.createdAt=Date.now();
      write(function(){return pr.set(pd);}).then(function(ok){if(ok){toast('Sondage lancé');openModal({kind:'poll',id:pr.id,pending:true});}});
    }
  }else if(kind==='member'){
    var name=val('name');if(!name){toast('Le nom est obligatoire.');return;}
    var md={name:name,number:val('number'),pos:val('pos'),status:val('status')||'actif',photo:okPhoto(val('photo'))};
    var mref=id?S.db.doc('members/'+id):S.db.collection('members').doc();
    write(function(){return id?mref.update(md):mref.set(md);}).then(function(ok){if(ok){closeModal();toast(id?'Joueur mis à jour':'Joueur ajouté');}});
  }else if(kind==='bulk'){
    var names=val('names').split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean).slice(0,40);
    if(!names.length){toast('Écris au moins un nom.');return;}
    write(function(){return names.reduce(function(p,n){return p.then(function(){return S.db.collection('members').doc().set({name:n,number:'',pos:'',status:'actif'});});},Promise.resolve());}).then(function(ok){if(ok){closeModal();toast(names.length+' joueur'+(names.length>1?'s':'')+' ajouté'+(names.length>1?'s':''));}});
  }else if(kind==='team'){
    write(function(){return mergeDoc(S.db.doc('meta/team'),{name:val('name'),place:val('place')});}).then(function(ok){if(ok){closeModal();toast('Réglages enregistrés');}});
  }else if(kind==='chat'){
    var room=f.dataset.room,ta=f.querySelector('textarea'),text=ta.value.trim().slice(0,500);
    if(!text||!hasProfile())return;
    ta.value='';autoGrow(ta);
    var cref=S.db.collection('chat').doc();
    write(function(){return cref.set({room:room,uid:S.uid,text:text,t:Date.now()});}).then(function(ok){if(!ok&&!ta.value){ta.value=text;autoGrow(ta);}});
    ta.focus();
  }else if(kind==='guest'){
    var gn=val('name');if(!gn){toast('Écris ton nom.');return;}
    saveIdentity(null,gn).then(function(ok){if(ok){closeModal();toast('Bienvenue '+gn+' !');}});
  }
});

/* ---------- Démarrage ---------- */
function subscribeCol(col,key,isMap){
  S.db.collection(col).onSnapshot(function(snap){
    if(isMap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data();});S[key]=o;}
    else S[key]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    S.loaded[key]=true;derive();schedule();
  },function(){S.loaded[key]=true;schedule();});
}
function makeDl(){return {save:function(o){return new Promise(function(res,rej){try{
  var b=new Blob([o.data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);res({status:'saved'});}catch(e){rej(e);}});}};}
function showGate(err){
  S.gate=true;$('#tabs').innerHTML='';$('#notice').innerHTML='';
  $('#view').innerHTML='<div class="gate"><h2>Code de l\'équipe</h2><p class="muted">Entre le code donné par ton capitaine pour accéder au planning.</p>'+
    '<form data-form="gate" autocomplete="off"><input name="code" type="password" aria-label="Code de l\'équipe" placeholder="Code" autocapitalize="off" autocomplete="off" required>'+
    (err?'<p class="err" role="alert">'+esc(err)+'</p>':'')+'<button class="btn primary" type="submit">Entrer</button></form></div>';
  $('#foot').hidden=true;
  var f=$('#view input');if(f)f.focus();
}
function setAccess(role){
  S.isAdmin=role==='admin';S.canWrite=true;S.gate=false;S.skipId=false;
  if(!S.started){S.started=true;startData();}
  render();
}
function submitGate(code){
  if(!code)return;
  var ref=S.db.doc('access/'+S.uid),btn=$('#view button[type=submit]');if(btn)btn.disabled=true;
  var put=function(role){return ref.set({role:role,code:code,t:Date.now()}).then(function(){return role;});};
  put('admin').catch(function(){return put('player');}).then(setAccess,function(e){
    showGate(e&&e.code==='permission-denied'?'Code incorrect.':'Connexion impossible, réessaie dans un instant.');
  });
}
function startData(){
  subscribeCol('events','events');subscribeCol('members','members');subscribeCol('polls','polls');
  subscribeCol('rsvp','rsvp',true);subscribeCol('proxy','proxy',true);
  S.db.collection('chat').orderBy('t','desc').limit(1000).onSnapshot(function(snap){
    try{S.chat=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});}catch(err){console.error(err);}
    if(!S.seenInit){S.seenInit=true;var sv=loadSeen();S.seen=sv!==null?sv:latestGeneral();saveSeen(S.seen);}
    S.loaded.chat=true;schedule(true);
  },function(){S.loaded.chat=true;schedule(true);});
  S.db.doc('meta/team').onSnapshot(function(s){S.team=s.exists?s.data():{};S.loaded.team=true;schedule();},function(){S.loaded.team=true;schedule();});
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEv=e;});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function start(){
  if(isStandalone()){var ab=$('#a2hsb');if(ab)ab.hidden=true;}
  var h=(location.hash||'').replace('#','');
  if(h==='sondages')S.tab='polls';else if(h==='equipe')S.tab='team';else if(h==='discussion')S.tab='chat';else if(h==='stats')S.tab='stats';
  render();
  var C=window.LEBANC_FIREBASE;
  if(!window.firebase||!C||!C.apiKey||/COLLE_ICI/.test(C.apiKey)){
    S.dbOff=true;S.dbMsg=window.firebase?"L'application n'est pas encore reliée à Firebase : renseigne la configuration (voir GUIDE.md).":"Impossible de charger Firebase (connexion ?). Recharge la page.";
    render();return;
  }
  try{
    firebase.initializeApp(C);S.db=firebase.firestore();S.dl=makeDl();
    firebase.auth().signInAnonymously().then(function(c){
      S.uid=c.user.uid;return S.db.doc('access/'+S.uid).get();
    }).then(function(snap){
      if(snap.exists&&snap.data().role)setAccess(snap.data().role);else showGate('');
    }).catch(function(e){
      S.dbOff=true;S.dbMsg="Connexion à l'équipe impossible"+(e&&e.code?' ('+e.code+')':'')+". Vérifie la configuration Firebase et ta connexion.";render();
    });
  }catch(e){S.dbOff=true;S.dbMsg="Configuration Firebase invalide.";render();}
}
start();
})();
</script>
